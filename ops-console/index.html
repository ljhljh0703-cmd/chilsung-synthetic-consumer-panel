<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 검증 운영실</title><style>

emplate-columns:repeat(3,1fr);gap:1px;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:20px 0;background:var(--line)}.stats>div{background:white;padding:18px}.stats strong{display:block;font-size:27px;line-height:1.4;letter-spacing:-.8px}.stats span{font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-width:60em;font:12px/1.8 ui-monospace,monospace;background:#f5f7fa;border:1px solid var(--line);padding:18px;max-height:420px;overflow:auto}details>summary{cursor:pointer;color:var(--blue);padding:10px 0}.flow{display:flex;flex-wrap:wrap;gap:8px;padding:15px;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;margin-bottom:20px}.flow span{font-size:12px;color:var(--muted)}.flow b{color:var(--ink)}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;padding:13px 22px;background:#23364f;color:white;box-shadow:0 4px 30px #0002;border-radius:8px;z-index:20}.step{border-top:1px solid var(--line);padding:16px 0}.step:first-of-type{border-top:0;padding-top:0}.step .num{float:left;margin-right:12px;width:24px;height:24px;text-align:center;border:1px solid var(--line);border-radius:100%;font-size:12px}.step p{margin:4px 0 0 36px;font-size:12px;color:var(--muted)}.experiment-select{max-width:300px;margin-bottom:20px}.decision{font-size:32px;letter-spacing:-1px;margin:8px 0}.footer{font-size:11px;color:var(--muted);margin-top:24px}.hidden{display:none!important}.products-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.inline{display:flex;gap:8px}.inline select{flex:1}.error{color:var(--red)}@media(max-width:900px){.shell{grid-template-columns:190px minmax(0,1fr)}main{padding:24px 20px}header{padding:0 20px}.grid{grid-template-columns:1fr}}@media(max-width:600px){.shell{display:block}aside{padding:15px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 12px}.brand small,.navfoot{display:none}nav{grid-template-columns:repeat(3,1fr);gap:3px}nav button{font-size:11px;padding:8px 4px;text-align:center}.idx{display:none}header{height:auto;min-height:65px;padding:12px 16px;flex-wrap:wrap;gap:6px}main{padding:22px 16px}.title{display:block}.title>.tag{margin-top:10px}h1{font-size:23px}.card{padding:18px}.fields{grid-template-columns:1fr}.ratios{grid-template-columns:repeat(3,1fr)}.stats strong{font-size:22px}.stats>div{padding:12px}.role select{width:120px}.table-wrap{max-width:100%}th,td{padding:10px}.flow{gap:5px}}

</style><div class="shell"><aside><div class="brand">시안 검증 운영실<small>CONCEPT REVIEW WORKSPACE</small></div><nav id="nav"></nav><div class="navfoot">로컬 업무 시연<br>역할 전환은 인증 기능이 아닙니다.<br><br>사람 조사에 올릴 후보를 고르는 앞단 도구</div></aside><div class="main"><header><span class="header-label">가상 조사 / 운영 프로세스</span><div class="role"><label for="role">현재 역할</label><select id="role"><option>BM</option><option>조사 담당</option><option>데이터 담당</option></select><button id="refresh">새로고침</button></div></header><main id="content" aria-live="polite"></main></div></div><div id="toast" class="notice hidden" role="status"></div>
<script src="/fit_view.js"></script><script src="/operation_view.js"></script><script>
let db={},view=location.hash.slice(1)||'overview',selected='T0',detail=null,competitors=[],setupPane='survey',selectedDiff='default.json',pendingReceipt='';
const pages=[['overview','현황'],['fit','모집단 정합성'],['intake','콘셉트 접수'],['setup','실험 설정'],['runs','실행 현황'],['checks','자기 점검'],['decision','판정·승인'],['survey','사람 조사·보정']];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=x=>x==null?'미확인':(x*100).toFixed(1)+'%',badge=x=>`<span class="tag ${x==='포기'||x==='실패'||x==='반려'?'bad':x==='신뢰'||x==='끝'||x==='승인'?'good':''}">${esc(x)}</span>`;
function toast(s){$('toast').textContent=uiTerm(s);$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),6000)}
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-Console-Token':db.token}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function action(path,d){try{let x=await api(path,d);await load();toast('저장했습니다. 변경 기록에 남겼습니다.');return x}catch(e){toast(e.message);return null}}
async function load(){db=await api('state');$('role').value=db.state.role;if(!db.experiments.some(x=>x.name===selected))selected=db.experiments[0]?.name;render()}
function title(t,s,tag='운영 시연'){return `<div class="title"><div><h1>${t}</h1><p class="sub">${s}</p></div>${badge(tag)}</div>`}
function selectExp(){return `<label for="exp">확인할 실험</label><select class="experiment-select" id="exp">${db.experiments.map(x=>`<option value="${esc(x.name)}" ${x.name===selected?'selected':''}>${esc(x.concept_title?x.concept_title+' · '+x.name:x.name)}</option>`).join('')}</select>`}
function field(label,id,placeholder='',type='text'){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`}
function bindExp(){if($('exp'))$('exp').onchange=e=>{selected=e.target.value;render()}}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function audit(name,receipt){return db.state.actions.filter(x=>!name||[x.detail?.name,x.detail?.experiment].includes(name)||(receipt&&x.detail?.receipt===receipt)).slice(-8).reverse().map(x=>`<div class="step"><strong>${esc(x.action)}</strong> <span class="small">${esc(x.actor)} · ${esc(x.time.slice(11,19))}</span><p>${esc(x.detail.memo||x.detail.name||x.detail.id||'업무 기록')}</p></div>`).join('')||empty('아직 변경 기록이 없습니다.')}
async function render(){
 $('nav').innerHTML=pages.map(([id,t],i)=>`<button class="${id===view?'active':''}" data-view="${id}"><span class="idx">0${i}</span>${t}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;location.hash=view;render()});
 let h='';
 if(view==='overview'){
  $('content').innerHTML=title('현황','대표성 검증부터 정량 조사 후보까지')+FitView.overview(db.overview);
 }else if(view==='fit'){
  $('content').innerHTML=title('모집단 정합성','사전 등록한 기준과 실제 검증 결과')+FitView.fitPage(db.fit,db.fit_limits);
  if(db.state.role==='조사 담당'&&db.fit.sha256){$('content').insertAdjacentHTML('beforeend','<section class="card"><label for="fitMemo">확인 메모</label><input id="fitMemo"><button id="fitReview">결과 확인 기록</button></section>');$('fitReview').onclick=()=>action('fit-review',{memo:$('fitMemo').value})}
 }else if(view==='audit'){
  $('content').innerHTML=title('판정 기록','실행 차단과 승인 기록')+FitView.table(['시각','처리','역할','이유'],db.state.actions.slice().reverse().map(x=>[x.time,x.action,x.actor,x.detail?.reason||x.detail?.memo||'']));
 }else if(view==='intake'){
 OperationView.intake(db,receipt=>{pendingReceipt=receipt;location.hash='setup'});
 }else if(view==='setup'){
 h=title('실험 설정','실행 전에 조건을 정합니다. 실행한 설정은 잠기며 변경은 새 실험으로 남깁니다.')+`<div class="grid"><section class="card"><h2>새 비교 실험</h2><div class="fields">${field('실험 이름','expName','OPS_로 시작하는 새 이름')}<div><label for="receipt">진열대</label><select id="receipt"><option value="">기존 진열대 재현</option>${db.state.receipts.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select></div><div><label for="category">범주</label><select id="category"><option>전체</option><option>맥주</option><option>소주</option><option>탄산</option></select></div>${field('진열대당 표본 수','n','150','number')}<div><label for="validationRef">시안 실행 전 재현 실험</label><select id="validationRef">${db.experiments.map(x=>`<option ${x.name==='T2'?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label for="batch">묻는 방식</label><select id="batch"><option value="5">5명 배치</option><option value="1">한 명씩</option><option value="15">15명 배치</option></select></div><div><label for="named">제품 이름</label><select id="named"><option value="0">이름 가림</option><option value="1">이름 공개</option></select></div><div class="wide"><label class="check"><input type="checkbox" id="perPerson" checked>사람마다 제시 순서 무작위화</label><div id="batchWarning" class="rule warn hidden">15명 배치는 응답이 서로 닮을 수 있습니다. 5명 이하 배치를 권장합니다.</div><label class="check"><input type="checkbox" id="equal">공통 속성만 사용하고 값마다 30자 이내로 맞춤</label><label for="goal">실험 목적</label><textarea id="goal" placeholder="이번 실험에서 확인할 것"></textarea></div></div><div class="actions"><button class="primary" id="saveExp" ${db.state.role!=='조사 담당'?'disabled':''}>설정 저장</button></div></section><div><section class="card"><h2>고정된 통과 기준</h2><div class="rule">기존 진열대 5개 전체를 비교할 때만 적용합니다.</div><div class="stats" style="grid-template-columns:1fr 1fr"><div><strong>4 / 5</strong><span>꼴찌 일치</span></div><div><strong>80%</strong><span>약한 제품이 낀 짝 맞힘</span></div></div><p class="small">작가 결정 2026-11-04. 범주를 좁히거나 신규 시안을 접수한 실험은 기준 미설정으로 남깁니다. 전체 결과를 본 뒤 임계값을 바꾸지 않습니다.</p></section><section class="card"><h2>설정 잠금</h2>${db.experiments.filter(x=>x.locked).slice(-5).map(x=>`<div class="products-item"><span>${esc(x.name)}</span>${badge('잠김')}</div>`).join('')||empty('실행된 실험이 없습니다.')}</section></div></div>`;
 $('content').innerHTML=h;
 let surveyPanel=$('content').querySelector('.grid');surveyPanel.id='surveySetup';
 $('content').querySelector('.title').insertAdjacentHTML('afterend','<div class="actions" style="margin:0 0 20px"><button id="surveyPane">가상 조사 설정</button><button id="modelsPane">페르소나·확산 설정</button></div>');
 surveyPanel.insertAdjacentHTML('afterend','<div id="modelSetup">'+configPanels()+'</div>');
 const pane=()=>{surveyPanel.classList.toggle('hidden',setupPane==='models');$('modelSetup').classList.toggle('hidden',setupPane!=='models');$('surveyPane').classList.toggle('primary',setupPane!=='models');$('modelsPane').classList.toggle('primary',setupPane==='models')};
 $('surveyPane').onclick=()=>{setupPane='survey';pane()};$('modelsPane').onclick=()=>{setupPane='models';pane()};pane();bindConfigPanels();
 const receiptControl=$('receipt'),setReceipt=()=>{
   const receipt=db.state.receipts.find(r=>r.id===receiptControl.value);
   const isConcept=Boolean(receipt);
   const batch=$('batch');
   for(const opt of batch.options)opt.disabled=isConcept&&opt.value!=='1';
   if(isConcept){batch.value='1';const per=$('perPerson');if(per){per.checked=true;per.disabled=true}}
   if(!isConcept&&$('perPerson'))$('perPerson').disabled=false;
   const now=new Date().toLocaleString('sv-SE').replace(/\D/g,'').slice(0,14);
   $('expName').value='OPS_'+(receipt?receipt.id.replace(/^OPS_CARD_/,'').slice(-6)+'_':'')+now;
 };
 receiptControl.onchange=setReceipt;
 if(pendingReceipt)receiptControl.value=pendingReceipt;
 const specForm=$('saveExp').closest('section');
 specForm.insertAdjacentHTML('beforeend',`<label for="sensitivityPair">민감도 비교 실험</label><select id="sensitivityPair"><option value="">미지정</option>${db.experiments.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`);
 $('batch').onchange=()=>$('batchWarning').classList.toggle('hidden',$('batch').value!=='15');$('n').value=150;setReceipt();$('saveExp').onclick=async()=>{let x=await action('experiment',{name:$('expName').value,n:Number($('n').value),sensitivity_pair:$('sensitivityPair').value,receipt:$('receipt').value,category:$('category').value,batch:Number($('batch').value),per_person_order:$('perPerson').checked,named:$('named').value==='1',equal:$('equal').checked,goal:$('goal').value,validation_reference:$('validationRef').value,diffusion_config:$('diffConfig')?.value||'default.json'});if(x){selected=x.name;view='runs';location.hash=view;render()}};
 }else if(view==='runs'){

 let cfg=db.configs||{},p=cfg.population,ready=p?.status==='사용 가능'&&p.data.reaction_mode,canPop=db.state.role==='데이터 담당',diffs=cfg.diffusion||[];
 let ratios=ready?Object.entries(p.data.ratios).map(([k,v],i)=>`<div><strong>${(v*100).toFixed(1)}%</strong><span>${['혁신자','초기 수용자','초기 다수','후기 다수','지체자'][i]}</span></div>`).join(''):'';
 return `<div class="grid"><section class="card"><h2>페르소나 설정 ${badge(ready?'원비율 고정':'준비 중')}</h2>${ready?`<div class="stats ratios">${ratios}</div><p class="small">유형 비율은 작가가 고정했습니다. 아래 조절 칸은 유형 배정과 반응 방식을 바꿉니다.</p><div class="fields"><div class="wide"><label class="check"><input id="keywordOn" type="checkbox" ${p.data.keyword_enabled?'checked':''}>한국 소비 성향 키워드 사전 사용</label><label class="check"><input id="ageOn" type="checkbox" ${p.data.age_signal_enabled?'checked':''}>보조 나이 신호 사용</label></div><div class="wide"><label for="reactionMode">반응 성향 방식</label><select id="reactionMode">${modeOptions(p.data.reaction_mode)}</select></div><div><label for="ageTilt">나이 영향 0~1</label><input id="ageTilt" type="number" min="0" max="1" step="0.05" value="${p.data.age_tilt}"></div><div><label for="sexBalance">유형별 성비</label><select id="sexBalance"><option value="within_sex" ${p.data.sex_balance==='within_sex'?'selected':''}>성별 안에서 유형 배정</option><option value="none" ${p.data.sex_balance==='none'?'selected':''}>사전 점수 그대로</option></select></div></div><p class="small">나이 영향 1은 사전 점수 그대로, 0은 나이대 안에서 따로 순위를 매깁니다. 성별 안에서 유형을 배정하면 각 유형의 성비를 원본에 맞춥니다.</p><div class="rule warn">저장한 뒤 표본을 다시 만들어야 결과에 반영됩니다. 이미 실행한 실험의 설정 사본은 바뀌지 않습니다.</div><div class="actions"><button id="savePopulation" class="primary" ${!canPop?'disabled':''}>페르소나 설정 저장</button><span class="small">데이터 담당 권한</span></div><details><summary>설정 원문과 출처 보기</summary><pre>${esc(JSON.stringify(p.data,null,2))}</pre></details>`:empty('페르소나 설정이 준비되면 조절 칸이 열립니다.')}</section><section class="card"><h2>확산 시뮬레이션 설정</h2>${diffs.length?`<label for="diffConfig">사용할 설정 파일</label><select id="diffConfig">${diffs.map(x=>`<option value="${esc(x.name)}" ${x.name===selectedDiff?'selected':''}>${esc(x.name)}${x.locked_runs?.length?' · 실행 이력 있음':''}</option>`).join('')}</select><div id="diffFields"></div>`:empty('확산 설정 폴더가 아직 준비 중입니다.')}</section></div>`
}
function modeOptions(selected){return [['two_axis_channel','두 축 + 통로 구분'],['two_axis_age','두 축 + 나이 차이'],['single_axis','유형 하나로 반응']].map(([v,t])=>`<option value="${v}" ${v===selected?'selected':''}>${t}</option>`).join('')}
function showDiffConfig(){let item=db.configs.diffusion.find(x=>x.name===$('diffConfig').value);if(!item)return;let c=item.data,can=['조사 담당','데이터 담당'].includes(db.state.role);$('diffFields').innerHTML=`<div class="fields" style="margin-top:18px"><div><label for="diffN">참여 인원</label><input id="diffN" type="number" min="2" max="100000" value="${c.n}"></div><div><label for="diffRounds">회차 수</label><input id="diffRounds" type="number" min="1" max="520" value="${c.rounds}"></div><div><label for="diffMode">판단 방식</label><select id="diffMode"><option value="rules" ${c.mode==='rules'?'selected':''}>규칙 계산</option><option value="llm" ${c.mode==='llm'?'selected':''}>언어모델</option></select></div><div><label for="diffReaction">반응 성향 방식</label><select id="diffReaction">${modeOptions(c.reaction_mode||db.configs.population?.data?.reaction_mode||'two_axis_channel')}</select></div><div><label for="diffFriends">통로당 평균 친구 수</label><input id="diffFriends" type="number" min="0" value="${c.network.mean_friends}"></div><div><label for="diffCap">언어모델 인원 상한</label><input id="diffCap" type="number" min="0" max="10000" value="${c.llm.max_people_total}"></div></div><div class="rule" style="margin-top:18px">${item.locked_runs?.length?'실행된 설정은 새 파일로 저장하세요.':'통로 구분 방식에서는 SNS·지인망 각각에 친구 수가 적용됩니다. 파일에 저장해 다음 확산 실행에 사용합니다.'} 저장만으로 실험을 실행하거나 자료를 전송하지 않습니다.</div><label for="diffNewName">새 파일 이름 (비우면 현재 파일)</label><input id="diffNewName" placeholder="예: channel_trial.json"><div class="actions"><button id="saveDiffusion" class="primary" ${!can?'disabled':''}>확산 설정 저장</button></div><details><summary>전체 설정값 보기</summary><pre>${esc(JSON.stringify(c,null,2))}</pre></details>`;$('saveDiffusion').onclick=async()=>{let edited=JSON.parse(JSON.stringify(c));edited.n=Number($('diffN').value);edited.rounds=Number($('diffRounds').value);edited.mode=$('diffMode').value;edited.reaction_mode=$('diffReaction').value;edited.network.mean_friends=Number($('diffFriends').value);for(let nc of Object.values(edited.network_channels||{})){if(Object.hasOwn(nc,'mean_friends'))nc.mean_friends=edited.network.mean_friends}edited.llm.max_people_total=Number($('diffCap').value);let x=await action('config',{kind:'diffusion',name:item.name,sha256:item.sha256,new_name:$('diffNewName').value.trim(),data:edited});if(x){selectedDiff=x.name;render();toast('확산 설정을 저장했습니다. 다음 실행에서 선택하세요.')}}}
function bindConfigPanels(){if($('savePopulation'))$('savePopulation').onclick=async()=>{if(!confirm('저장하면 모집단 정합성이 재검증 필요로 바뀌고 신제품 실행이 막힙니다.'))return;let p=db.configs.population,c=JSON.parse(JSON.stringify(p.data));c.keyword_enabled=$('keywordOn').checked;c.age_signal_enabled=$('ageOn').checked;c.reaction_mode=$('reactionMode').value;c.age_tilt=Number($('ageTilt').value);c.sex_balance=$('sexBalance').value;let x=await action('config',{kind:'population',name:'adopter.json',sha256:p.sha256,data:c});if(x)toast('설정을 저장했습니다. 표본을 다시 만들면 반영됩니다.')};if($('diffConfig')){$('diffConfig').onchange=()=>{selectedDiff=$('diffConfig').value;showDiffConfig()};showDiffConfig()}}

function brandBlock(d){let c=d.brand_comparison,rows=[];for(let [sid,ps] of Object.entries(c?.difference||{})){for(let [p,x] of Object.entries(ps))rows.push(`<tr><td class="mono">${esc(p)}</td><td>${pct(x.blind)}</td><td>${pct(x.named)}</td><td>${x.difference_pp} %p</td></tr>`)}return rows.length?`<p class="small">비교 실험: ${esc(c.paired_experiment||d.name)}</p>`+table(['제품','이름 가림','이름 공개','차이'],rows):empty('같은 조건의 공개·가림 양쪽 결과가 필요합니다.')}
function calibrationBlock(d){let c=d.calibrated;if(!c)return '';let rows=[];for(let [sid,products] of Object.entries(c.shelves||{})){for(let [p,v] of Object.entries(products))rows.push(`<tr><td class="mono">${esc(sid)} / ${esc(p)}</td><td>${pct(v.before)}</td><td>${pct(v.after)}</td><td>${pct(v.human)}</td></tr>`)}return `<section class="card"><h2>승인한 보정값 적용 ${badge(c.status)}</h2><p class="small">${esc(c.reason)}</p>${rows.length?table(['제품','보정 전','보정 후','사람 조사'],rows):empty('승인한 보정 결과가 없습니다.')}</section>`}
function ATTRFIELDS(){return ['종류','도수','용량','가격','맛','포장'].map((k,i)=>field(k,'attr'+i,['라거','4.5%','500mL','2,500원','가벼운 곡물 향','캔'][i])).join('')}
function showProducts(){if(!$('products'))return;$('products').innerHTML=competitors.map((p,i)=>`<div class="products-item"><span>${esc(p.real_name||p.id)}</span><button data-remove="${i}">빼기</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{competitors.splice(Number(b.dataset.remove),1);showProducts()});showBalance()}
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1)||'overview';if(next!==view){view=next;render()}});
$('role').onchange=e=>action('role',{role:e.target.value});
$('refresh').onclick=()=>load().catch(e=>toast(e.message));
load().catch(e=>{$('content').textContent='불러오지 못했습니다: '+e.message});
</script></html>
